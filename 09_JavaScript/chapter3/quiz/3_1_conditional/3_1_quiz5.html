<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    // 문제5
    // 사용자로부터 세 개의 정수를 입력받아,
    // 그 수들의 최대값과 최소값, 합계와 평균을 구해서 브라우저에 출력하세요.
    const num1 = Number(prompt('첫번째 숫자를 입력해주세요!'));
    const num2 = Number(prompt('두번째 숫자를 입력해주세요!'));
    const num3 = Number(prompt('세번째 숫자를 입력해주세요!'));

    const sum = num1 + num2 + num3;
    const avg = sum / 3;

    let max = num1;
    let min = num1;

    // 참고
    // Math 객체의 max() 함수 이용
    console.log(Math.max(num1, num2, num3));
    // Infinity 객체를 사용하여 (Infinity / -Infinity) 무한대 / -무한대 의 값으로 max / min의 값을 초기화할 수도 있음

    if (max < num2) {
      max = num2;
      if (max < num3) {
        max = num3;
      }
    } else {
      if (max < num3) {
        max = num3;
      }
    }

    if (min > num2) {
      min = num2;
      if (min > num3) {
        min = num3;
      }
    } else {
      if (min > num3) {
        min = num3;
      }
    }

    document.write(`입력하신 숫자는 ${num1}, ${num2}, ${num3}입니다.`, '<br>');
    document.write(`합계는 ${sum}입니다.`, '<br>');
    document.write(`평균은 ${avg}입니다.`, '<br>');
    document.write(`최대값은 ${max}입니다.`, '<br>');
    document.write(`최소값은 ${min}입니다.`, '<br>');

    // 풀이5
    // 주의! 덧셈을 하거나 문자끼리 비교를 피하려면 숫자로 변환해 줄 것!!
    //'11' > '2' => false
    //'11' > 2 => true
    
  </script>
</head>

</body>
</html>
