<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- * -->
  <button type="button" onclick="changeColor()">배경색 바꾸기</button>

  <hr>

  <!-- ** -->
  <input type="text" id="id" placeholder="아이디"><br>
  <input type="text" id="pw" placeholder="비밀번호">
  <button type="button" class="btn-login">로그인</button>

  <hr>

  <!-- *** -->
  <div>
    <p>
      <button type="button" onclick="gallery('before')">이전</button>
      <button type="button" onclick="gallery('after')">다음</button>
    </p>
    <p>
      <img src="images/pic_1.jpg" alt="포토" class="photo">
    </p>
  </div>

  <hr>
  <script>
    // 함수
    // 여러 실행 코드들의 묶음(그룹화)
    // 자주 사용하는 코드들(기능)을 저장했다가 필요할 때 호출해서 사용
    // function 키워드를 사용하여 정의 => ES6차에서는 화살표 함수를 사용

    // 1) 함수 선언문: 기명 함수로 정의
      function 함수명(매개변수) {
        실행코드;
      }
      
      // 2) 함수 표현식: 익명 함수를 변수에 할당
      const 변수 = function (매개변수) {
        실행코드;
      };
      // 변수를 초기화 한 것이기 때문에 ;까지 반드시 들어가야 함!!
      

    // 위와 같이 정의된 함수는 즉시 실행되지 않음
    // 메모리에 할당되어 있다가 함수가 호출되면 실행
    // 1) 함수명();
    // 2) 변수명();

    // 함수 선언
    function greeting() {
      document.write('hello<br>');
    }
    // 함수 호출
    greeting();

    // (참고) 함수 선언문과 함수 표현식의 차이점
    // 함수 선언문은 호이스팅(끌어 올리기)이 일어난다. 
    // 해당 스코프(유효범위)의 최상단으로 끌어올려진 것과 같은 현상(실제로 끌어올리는 것은 아님)
    // 변수나 함수 선언이 코드 실행 보다 먼저 메모리에 할당(저장)되는 과정

    let count = 0;
    
    // 함수 선언문의 경우: 코드 실행 시, 가장 먼저 찾아 메모리에 할당됨. 그 이후 코드가 실행됨 => 함수 선언 위에서 함수 호출 가능
    myFunc();
    
    function myFunc() {
      count++;
      document.write('hello' , count, '<br>');
    }
    myFunc();
    
    // 함수 표현식의 경우: 함수 선언 위에서 함수 호출 불가
    // theFunc(); // 초기화 전에는 쓸 수 없음
    
    const theFunc = function () {
      count++;
      document.write('hello' , count, '<br>');
    }
    theFunc();

    document.write('<hr>');

    // 버튼 클릭할 때마다 배경색이 바뀌도록 함수 만들기
    // (body 태그 참조*)
    const colors = ['yellow', 'aqua', 'purple', 'white'];

    const bodyTag = document.querySelector('body');
    let idx = 0;
    function changeColor() {
      bodyTag.style.backgroundColor = colors[idx++];
      if (idx >= colors.length) idx = 0;
    }

    // 3) 매개변수가 있는 함수
    // function 함수(매개변수1, 매개변수2, ...) {
    //   실행코드;
    // }
    // 함수(인자값1, 인자값2, ...);
    function introduce(name, area = '대한민국') { // 외부에서 받을 데이터가 있으면 매개변수 선언
    // 값이 들어가지 않을 경우 디폴트 파라미터 설정 가능 (ES6차 문법)
      document.write(`안녕하세요. ${name}입니다.<br>`);
      document.write(`사는 곳은 ${area}입니다.<br>`);
    }
    introduce('김재현', '영등포'); // 인수(인자값, 매개값)을 넘겨줌
    introduce('김재현'); // 인수를 다 안 넣었는데 실행됨;;;;; 자바에서는 말도 안 됨
    introduce('김재현', '영등포', '무의미한 데이터'); // 인수 갯수가 하나 더 많은데도 실행하는데는 문제 없음;;;;;;;;;;;

    document.write('<hr>');

    // 로그인 함수 만들기 실습
    const dbUser = {
      id: 'goni',
      pw: '1234',
      name: '김재현'
    };

    const inputId = document.querySelector('#id');
    const inputPw = document.querySelector('#pw');
    const btnLogin = document.querySelector('.btn-login');

    btnLogin.addEventListener('click', function () {
      const msg = login(inputId.value, inputPw.value);
      document.write(msg);
    })

    function login(id, pw) {
      // let msg = '아이디와 비밀번호를 다시 확인해주세요;;';
      // if (id === dbUser.id && pw === dbUser.pw) msg =`${dbUser.name}님 환영합니다🥸`;
      
      // return msg;
      
      // 안되는 케이스 먼저 체크
      let msg = '환영합니다';
      if (id !== dbUser.id) {
        msg = 'id를 다시 확인해주세요';
      } else if (pw !== dbUser.pw) {
        msg = 'pw를 다시 확인해주세요';
      }

      return msg;
    }

    // 4) 함수에서 return문의 역할
    // 데이터(결과값)를 반환
    // 함수를 강제 종료
    // function 함수명() {
    //   실행코드1;
    //   return 값;

    //   실행코드2; (실행X)
    // }
    function sum(num1, num2) {
      return num1 + num2;
    }
    const result = sum(10, 20);
    document.write(`두 수의 합은 ${result}<br>`);

    // 여러 과목의 점수를 입력받아 평균 점수 구하기
    const subjects = ['국어', '영어', '수학'];

    function testAvg(arr) {
      let sum = 0;
      for(let i = 0; i < arr.length; i++) {
        sum += Number(prompt(`${arr[i]} 점수 입력`));
      }
      
      return sum / arr.length;
    }

    document.write('<hr>');

    // document.write(`평균 점수: ${testAvg(subjects)}`);

    // Quiz: 이전/다음 버튼으로 이미지를 넘기는 gallery() 함수 만들기
    // 위 *** 참조
    // 힌트: img 태그를 가져온 후 src 속성을 이용하거나 HTML 속성을 추가하는 setAttribute() 메소드 이용
    const img = document.querySelector('img');

    let cnt = 1;
    function gallery(direction, tag = img) {
      if (direction === 'before') cnt--;
      if (direction === 'after') cnt++;
      if (cnt < 1) cnt = 8;
      if (cnt > 8) cnt = 1;
      tag.src = `./images/pic_${cnt}.jpg`;
    }

    // 5) 스코프(유효 범위) 개념
    // 변수 또는 함수의 사용 가능한 유효 범위
    // 전역 스코프: 코드의 어느 곳에서나 접근 가능
    // 블록 스코프: 선언된 블록 내부에서만 접근 가능
    // 여기에서 블록은 함수, 조건문, 반복문 등 중괄호({})로 구분되는 모든 영역을 의미

    // 전역 변수와 지역 변수
    const globalNum = 50; // 전역 변수

    function testVarScope() {
      const localNum = 200; // 지역 변수
      document.write(`함수 안: ${globalNum}<br>`);
      document.write(`함수 안: ${localNum}<br>`);
    }
    testVarScope();
    document.write(`함수 밖: ${globalNum}<br>`);
    // document.write(`함수 밖: ${localNum}<br>`); // Uncaught ReferenceError: localNum is not defined

    // 전역과 지역을 나누는 이유?
    // 변수명(또는 비슷한 기능의 함수명)의 충돌을 피하기 위해
    // 해당 데이터가 전체에서 쓰인다면 전역 변수로, 함수 내 또는 제어문 내에서만 쓰이면 지역 변수로 선언
    // 지역 변수의 예: for문의 초기화식
    for (let i = 0; i < 1; i++) {
      
    }
    for (let i = 0; i < 1; i++) {
      
    }

    // 6) 내장 함수
    // 자바스크립트 엔진에 내장되어 바로 호출 가능한 함수
    
    // 문자열 데이터를 정수형 데이터로 반환
    console.log(parseInt('10.33')); // 10
    console.log(parseInt('15.5px')); // 15
    console.log(parseInt('a40')); // NaN
    console.log(parseInt(true)); // NaN

    // 문자열 데이터를 실수형 데이터로 반환
    console.log(parseFloat('10.33')); // 10.33
    console.log(parseFloat('15.5px')); // 15.5
    console.log(parseFloat('a40')); // NaN
    console.log(parseFloat(true)); // NaN
    
    // 문자형 데이터로 반환
    console.log(String(5)); // '5'
    console.log(String([1, 2, 3, 4])); // '1,2,3,4'
    console.log(String(new Date())); // Sat Jan 07 2023 19:12:03 GMT+0900 (한국 표준시)

    // 숫자형 데이터로 반환(숫자형으로 바꿀수 없으면 NaN을 반환)
    console.log(Number('5')); // 5
    console.log(Number(true)); // 1
    console.log(Number(false)); // 0
    console.log(Number('abc')); // NaN

    // 논리형 데이터로 반환
    // false 값들: false, 0(-0), ''(""), undefined, null, NaN
    console.log(Boolean(5)); // true
    console.log(Boolean(null)); // false
    console.log(Boolean(10 > 9)); // true

    // NaN(Not-a-Number) 값이면 true를 반환
    console.log(isNaN(5)); // false
    console.log(isNaN(5 - 2)); //false
    console.log(isNaN('123')); // false, 테스트하기 전에 값을 숫자로 변환
    console.log(isNaN('Hello')); // true

    // (참고) 대문자로 시작하는 내장 함수 = 생성자 함수
    // new 키워드와 함께 생성자도 되고, new 없이 그냥 형변환 함수처럼도 동작하는 특수한 생성자 함수

  </script>
</body>
</html>
