<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 서버에 데이터 요청하기
    // 서버: 데이터 달라고 하면 데이터 주는 애
    // 데이터: html, css, js 또는 JSON 데이터 등
    // 요청: 서버에 정해놓은 규격대로 맞춰서 보내야 됨, 어디(URL 주소)로 어떤 방법(GET/POST 등)으로 보낼지 등
    // 일반적으로 데이터를 가져올 때(검색, 조회)는 GET 요청
    // 데이터를 보낼 때(추가, 수정, 삭제)는 POST 방식 사용
    // 그 외 PUT(전체 수정), PATCH(부분 수정), DELETE(삭제) 등도 있음

    // 자바스크립트를 이용하여 서버 쪽 데이터 요청 가능 = AJAX 사용하면 됨(비동기 방식, 새로고침 안됨)

    // AJAX란?
    // Asynchronous JavaScript and XML의 약자, 비동기 자바스크립트와 XML
    // 자바스크립트를 이용해서 비동기식으로 서버와 통신하는 방식. 이 때 XML을 이용
    // 꼭 XML을 이용할 필요는 없고, 최근에는 json을 더 많이 이용
    // 비동기식이란 여러가지 일이 동시적으로 발생한다는 뜻으로, 서버와 통신하는 동안 다른 작업을 할 수 있다는 의미

    // AJAX 쓰는 다양한 방법
    // 1. XMLHttpRequest(XHR) 객체 - (잘안씀)
    // 이름에 XML이 들어가긴 하지만, XML 뿐만 아니라 다양한 종류의 데이터를 가져올 수 있음
    // 2. fetch() 함수 - ES6차의 HTTP 요청 함수
    // 3. axios - 외부 라이브러리(많이 씀)

    // 기존에는 XMLHttpRequest를 사용해 AJAX 요청을 처리했지만, 다음과 같은 단점이 존재
    // 1) 문법이 복잡하고 가독성이 떨어짐
    // 2) Promise 기반이 아님
    // 3) JSON, Blob, FormData 등 현대적 데이터 처리에 불편

    // 이를 개선한 Fetch API
    // 1) Promise 기반 비동기 처리 (Promise 기반 = fetch() 완료 후에 그 자리에 오는 게 Promise 객체라는 뜻)
    // 2) 더 깔끔하고 선언적인 문법
    // 3) JSON, 텍스트, 스트림 등 다양한 응답 처리 지원

    // 주요 속성
    // method: HTTP 요청 메소드(GET, POST, PUT, DELETE 등)
    // body: 서버로 전송할 데이터
    // content-type 정의: 서버에 전송하는 데이터의 타입을 지정

    // Content-Type 정리(HTTP POST 요청 시 주요 데이터 형식)
    // Content-Type                      | 전송 형식 예시         | 설명
    // application/json                  | JSON.stringify(data)  | JSON 포맷(대부분의 API가 선호함)
    // application/x-www-form-urlencoded | key=value&key2=value2 | HTML form 방식(기본 form 전송)
    // multipart/form-data               | FormData(파일 포함)    | 파일 업로드나 복합 데이터 전송에 사용(boundary 자동 생성됨)
    // text/plain                        | "단순 텍스트"          | 순수 텍스트 문자열 전송. 텍스트 자체를 전달

    // GET = id가 1인 데이터 조회
    fetch('https://jsonplaceholder.typicode.com/posts/1') // new Promise()와 같음 (Promise 객체를 반환해 줌)
      .then((response) => { // 성공시 실행할 함수
        console.log(response);
        return response.json(); // 응답받은 데이터(문자열)를 파싱해서 JS 객체로 반환함
        // return을 꼭 해주어야 다음 then에서 받아올 수 있음
      })
      .then((data) => {
        console.log(data);
      });

    // (참고) 프로미스: "결과를 약속합니다!"
    // 예: 네트워크 요청 같은 시간이 걸리는 로직을 통해 데이터를 받아오면
    //     그 때 네가 then()에 등록한 콜백 함수를 싱행할 것을 약속할게

    // POST - 데이터 생성
    fetch('https://jsonplaceholder.typicode.com/posts', {
      method: 'POST',
      body: JSON.stringify({
        title: 'foo',
        body: 'bar',
        userId: 1,
      }),
      headers: {
        'Content-type': 'application/json; charset=UTF-8',
      },
    })
      .then(response => response.json())
      .then(data => console.log(data));
      
    // PUT - 데이터 수정
    fetch('https://jsonplaceholder.typicode.com/posts/1', {
      method: 'PUT',
      body: JSON.stringify({
        id: 1,
        title: 'foo',
        body: 'bar',
        userId: 1,
      }),
      headers: {
        'Content-type': 'application/json; charset=UTF-8',
      },
    })
      .then((response) => response.json())
      .then((json) => console.log(json));

    // DELETE - 데이터 삭제
    fetch('https://jsonplaceholder.typicode.com/posts/1', {
      method: 'DELETE',
    });
  </script>
</body>
</html>

<!-- 동기식과 비동기식의 가장 큰 차이는
  동기식은 응답 올 때까지 멈춤,
  비동기식은 기다리지 않고 진행

  1) 동기식 요청(Synchronous Request)
  요청을 보낸 뒤, 응답이 올 때까지 브라우저가 멈춤
  응답이 올 때까지 다른 작업을 할 수 없음
  사용성, 퍼포먼스 모두 떨어져 현대 웹에서는 거의 사용 안 함

  예시:
  전통적인 <form> 전송
  과거 결제 모듈에서 사용

  2) 비동기식 요청(Asynchronous Request)
  요청을 보낸 뒤에도 브라우저는 멈추지 않고 다른 작업을 계속할 수 있음
  서버 응답이 도착하면 그때 처리함
  사용자가 화면 조작을 계속할 수 있어서 UX가 좋음

  예시:
  검색 자동완성
  댓글 달기
  쇼핑몰 장바구니 추가
  무한 스크롤
-->

<!-- 
  🚫 사용 자제 이유
  메인 작업이 블로킹되며 UI가 멈춤(웹에서는 브라우저가 멈춤)
  사용자 경험(UX) 저하
  최신 브라우저에서는 사용을 권장하지 않거나 경고 출력
  Service Worker, Fetch API, async/await 등으로 대체 가능

  🔴 동기식 요청이 응답을 기다리는 동안의 브라우저 상태
  UI가 완전히 멈춤
  브라우저는 해당 요청이 타임아웃되거나 수동으로 중단될 때까지 대기
  사용자는 브라우저가 먹통이 된 것처럼 느낌
  로딩 인디케이터나 알림조차 나타나지 않음
  일정 시간 동안 아무 응답 없이 멈춰 있으면 크롬, 엣지 등은
  “페이지가 응답하지 않습니다. 종료하시겠습니까?” 같은 경고를 띄울 수 있음

  ✅ 결론
  실무에서는 거의 대부분 비동기 요청이 사용되며,
  동기 요청은 아주 특수한 경우나 과거 코드 호환용으로만 남아 있음
-->
