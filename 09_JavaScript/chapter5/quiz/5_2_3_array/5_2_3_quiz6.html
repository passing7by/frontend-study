<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    // 문제6
    // 로또 번호 추첨기(완성)
    // 반복문을 이용하여 1~45까지의 랜덤한 정수값을 만들어내고 중복값이 아닐때만 lottoArr 배열에 추가해준다.
    // 로또 번호가 6개가 완성되면 오름차순으로 정렬까지 해서 출력해보세요.
    // while문 사용하면 조금 더 편함!

    const lottoArr = []; // 빈 배열

    // 풀이6
    let pushCnt = 0;
    let cnt = 0;
    while (pushCnt < 6) {
      // 랜덤 숫자 생성
      const randomNum = Math.floor(Math.random()*45)+1;
      let isExist = false;
      // lottoArr 내부에 같은 값 있는지 확인
      for (let i = 0; i < lottoArr.length; i++) {
        if (lottoArr[i] === randomNum) {
          isExist = true;
          break;
        }
      }
      // 같은 값 없으면 push()
      if(!isExist) {
        lottoArr.push(randomNum);
        pushCnt++;
      }
    }
    
    // 오름차순 정렬
    lottoArr.sort((a, b) => { return a - b; });

    document.writeln('<h2>🐉하다고 소문난 로또 번호 추첨기</h2>');
    document.writeln('<h3>당신의 로또 번호는??</h3>');
    document.writeln(lottoArr.join(' '));
  </script>
</head>
<body>
  
</body>
</html>
