<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    // 문제2
    // 나 자신의 정보로 사람(person) 객체 만들기(리터럴 방식 이용)
    // 속성 - firstName(문자), lastName(문자), age(숫자), gender('남자' or '여자'), hobby(배열 [])
    // 메소드 - firstName과 lastName 두 문자열을 연결하여 반환하는 getFullName() 작성,
    // 이외에도 speak(), walk(), eat() 등 자유롭게 한가지 이상 작성
    // (메소드 내 실행 코드는 return문을 사용하여 간단한 문자열 반환)

    // 객체 완성 후 모든 속성 및 메소드 결과를 출력해보세요.
    // 단, 객체의 속성 값을 얻기 위해 점 표기법(.)과 대괄호 표기법([])을 골고루 사용해 볼 것!
    const person = {
      firstName: '김',
      lastName: '지남',
      age: 28,
      gender: '여자',
      test: {
        'test 1': {
          'test 2': 'test 3'
        }
      },
      'my hobby': ['동영상 편집', '책읽기', '고양이 유튜브 시청', '노래 부르기', '자전거 타기', '친구 만나기'],
      getFullName: function () {
        return this.firstName + this.lastName;
      },
      walk: function () {
        return '터벅터벅....🚶‍♀️';
      },
      planThisWeekend: function () {
        // return `이번 주말에는 ${this['my hobby'][Math.floor(Math.random()*5)]}을(를) 할거야!`;
        return `이번 주말에는 ${this['my hobby'][Math.floor(Math.random()*this['my hobby'].length)]}을(를) 할거야!`;
      }
    }

    console.log(person['test']['test 1']['test 2']);
    
    document.write(person);
    document.write('<br>', JSON.stringify(person));
    document.write('<br>', person.firstName);
    document.write('<br>', person.lastName);
    document.write('<br>', person.age);
    document.write('<br>', person['gender']);
    document.write('<br>', person.getFullName());
    document.write('<br>', person.walk());
    document.write('<br>', person['my hobby'][3]);
    document.write('<br>', person.planThisWeekend());

    // 풀이2
    
  </script>
</head>
<body>
  
</body>
</html>
