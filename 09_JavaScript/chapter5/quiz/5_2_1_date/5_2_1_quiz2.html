<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    // 문제2
    // 요일 보여주기

    // 특정 날짜 객체를 생성하면 'SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT' 형식으로 요일을 보여주도록 만들어보세요.
    // 2가지 방법으로 각각 구현해 볼 것!
    // 1) 조건문(if 또는 switch)을 이용한 방법
    // 2) 배열을 이용한 방법

    // 예시:
    // let date = new Date(2023, 0, 5); // 2023년 1월 5일
    // "THU"가 출력되어야 합니다.

    const target = new Date();
    console.log(target);
    
    const targetDay = target.getDay();
    console.log(targetDay);

    // 풀이2-1
    // 조건문
    let targetDayStr;
    switch (targetDay) {
      case 0:
      targetDayStr= 'SUN'; break;
      case 1:
      targetDayStr= 'MON'; break;
      case 2:
      targetDayStr= 'TUE'; break;
      case 3:
      targetDayStr= 'WED'; break;
      case 4:
      targetDayStr= 'THU'; break;
      case 5:
      targetDayStr= 'FRI'; break;
      case 6:
      targetDayStr= 'SAT'; break;
    }
    document.writeln(targetDayStr);
    
    // 풀이2-2
    // 배열
    const dayArr = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    targetDayStr = dayArr[targetDay];
    document.writeln(targetDayStr);
  </script>
</head>
<body>
  
</body>
</html>
