<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

<body>
  <!-- 1. 랜덤값 출력 -->
  <h1>내맘대로 랜덤</h1>
  <label for="start">시작</label>
  <input type="text"id="start">
  <br>
  <label for="end">종료</label>
  <input type="text"id="end">
  <br>
  <button type="button" id="excute" onclick="generateRandomNum()">실행</button>

  <script>
    const generateRandomNum = () => {
      const start = Number(document.querySelector('#start').value);
      const end = Number(document.querySelector('#end').value);
      
      // 길이가 10인 배열 생성
      const arr = new Array(10);

      for(let i = 0; i < arr.length; i++) {
        // 랜덤값 생성 (start <= x <= end) 후 배열에 저장
        let randomNum = Math.floor(Math.random()*(end - start + 1)) + start;      
        arr[i] = randomNum;
      }
      alert(arr);
    };
  </script>

  <br>

  <!-- 2. Math 객체 연습 -->
  <h1>Math 객체 연습</h1>
  <p id="floor">Floor: 7.8</p>
  <p id="round">Round: 5.5</p>

  <button onclick="applyMathFunctions();">Math 함수 적용</button>
  <script src="./6_hw_object.js"></script>

  <!-- 3. 로또 -->
  <h1>로또 번호 출력하기</h1>
  <p>1~45 사이의 숫자중에서 랜덤값 6개 뽑기</p>
  <p>* 숫자값 중복 불가</p>
  <p>* 오름차순 정렬</p>
  <button type="button" id="lotto">로또</button>
  <div id="lottonums"></div>

  <script>
    // 로또 버튼을 클릭
    // 랜덤으로 6개 숫자를 생성(1~45)
    // 오름차순 정렬
    // <p>번호</p>를 6개 만들어서 변수에 저장한 다음
    // div.innerHTML = 변수;
    const lottoBtn = document.querySelector('#lotto');
    const lottonumsDiv = document.querySelector('#lottonums')

    lottoBtn.addEventListener('click', () => {
      // const lottoNum = Math.floor(Math.random()*45)+1;
      // console.log(lottoNum);
      
      let lottoNums = new Array(6);

      // 로또 번호 생성
      for (let i = 0; i < lottoNums.length; i++) {
        lottoNums[i] = Math.floor(Math.random()*45)+1;
      }

      // 오름차순 정렬
      // lottoNums.sort((a, b) => {a - b;} );

      /*
      윗줄의 코드는 동작 안 함. 왜?

      - 화살표 함수를 사용할 경우, 기본적으로 다음의 양식으로 작성
      (인자값) => {
        실행문

        return 반환값;
      }
      - 변형 양식의 사례는 다음과 같음
      1. 인자값이 하나일 경우 - '()' 생략 가능
      2. {} 안에 실행문 없이 return문만 있을 경우
        - {}와 return 생략 가능
        - 이 때, 둘 중 하나만 생략하면 안됨!! 둘 다 생략해야 함!!
      */
      
      lottoNums.sort((a, b) => a - b);
      // lottoNums.sort(function(a, b) { return a - b; });
      console.log(lottoNums);
      

      // innerHTML에 넣을 문자열 생성
      let lottoNumsHtml = '';
      for (const el of lottoNums) {
        lottoNumsHtml += `<p>${el}</p>`;
      }
      lottonumsDiv.innerHTML = lottoNumsHtml;
    })
  </script>

  <!-- 4. 랜덤 배경색 -->
  <h1>랜덤 배경색</h1>
  <button type="button" id="btn-changeColor" onclick="">바꾸기</button>
  <p id="currentBgColor"></p>

  <script>
    const btnChangeColor = document.querySelector('#btn-changeColor');
    const body = document.querySelector('body');
    const currentBgColor = document.querySelector('#currentBgColor');
    
    btnChangeColor.addEventListener('click', () => {  
      const r = Math.floor(Math.random()*256);
      const g = Math.floor(Math.random()*256);
      const b = Math.floor(Math.random()*256);
      const a = Math.random();
      const ramdomColor = `rgba(${r}, ${g}, ${b}, ${a})`;
      body.style.backgroundColor = ramdomColor;
      currentBgColor.innerText = `현재 배경색: ${ramdomColor}`;
    })
  </script>
</body>
