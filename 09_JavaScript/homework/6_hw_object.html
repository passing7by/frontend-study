<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body style="background-color: aquamarine;">
  <!-- 4. 랜덤 배경색 -->
  <button type="button" id="btn-changeColor" onclick="">바꾸기</button>
</body>
</html>

<script>
  const btnChangeColor = document.querySelector('#btn-changeColor');
  const body = document.querySelector('body');
  
  // btnChangeColor.addEventListener('click', () => {    
  //   const ramdomColor = '#' + Math.floor(Math.random()*1000000);
  //   body.style.backgroundColor = ramdomColor;
  //   body.innerText = `현재 배경색: ${ramdomColor}`;
  // })
  btnChangeColor.addEventListener('click', () => {    
    const ramdomColor = `rgba(${Math.floor(Math.random()*256)}, ${Math.floor(Math.random()*256)}, ${Math.floor(Math.random()*256)}, ${Math.random()})`;
    body.style.backgroundColor = ramdomColor;
    body.innerText = `현재 배경색: ${ramdomColor}`;
  })
</script>
