<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <script defer src="./main.js"></script>
</head>
<body>
  <h1>홀수? 짝수?</h1>
  <button class="btn-addBall" type="button">구슬 추가</button>
  <button class="btn-oddOrEven" type="button">홀짝</button>
  <button class="btn-cleanBall" type="button">초기화</button>
  <br>
  <br>
  <div class="ball-wrapper" style="display: flex; flex-wrap: wrap; gap: 10px"></div>

  <hr>

  <div style="width: 255px;">
    <h1>계산기</h1>
    첫번째 값 : <input class="input-firstNum" type="number">
    <br>
    <br>
    두번째 값 : <input class="input-secondNum" type="number">
    <br>
    <br>
    <button class="btn" type="button">+</button>
    <button class="btn" type="button">-</button>
    <button class="btn" type="button">X</button>
    <button class="btn" type="button">/</button>
    <button class="btn" type="button">%</button>
    <hr>
    계산 결과: <span class="span-calResult"></span>
  </div>

  <h1>문자 누적하기</h1>
  <input class="input-word" type="text">
  <button class="btn-addWord" type="button">누적</button>
  <br>
  <br>
  <textarea class="textarea-result" style="width: 210px; height: 70px; resize: none;"></textarea>
</body>
</html>
