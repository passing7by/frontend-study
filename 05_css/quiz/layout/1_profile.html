<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    .profile {
      /* text-align: center; */
    }
    .profile > img {
      /* (참고) img는 인라인 요소이지만 인라인-블록처럼 동작 */
      width: 100px;
      /* 요소를 원으로 만들기 */
      border-radius: 50%;
      /* 이미지 가운데 정렬하기(2가지) */
      /* 1) 부모에 text-align: center; */
      /* 2) 가로 길이를 갖는 블록 요소에 margin: 0 auto; */
      display: block;
      margin: 0 auto;
    }
    
    .title, .subtitle, .content {
      /* 글자 가운데 정렬 */
      text-align: center;
    }

    .subtitle > span {
      color: red;
      font-weight: bold;
    }

    .content {
      background-color: cornflowerblue;
      width: 450px;
      margin: 0 auto;
      padding: 20px;
      color: white;
      border-radius: 5px;
      box-shadow: 5px 5px #555555;
    }
  </style>
</head>
<body>
  <!-- 주어진 구조 외에 추가 가능 -->
  <!-- div.profile>img -->
  <div class="profile">
    <img src="./image.jpg" alt="">
  </div>

  <!-- h3.titile -->
  <h3 class="title">김지남</h3>

  <!-- p.subtitle -->
  <p class="subtitle"><span>농담곰</span> 애호가</p>

  <!-- p.content -->
  <p class="content">
    안녕하세요<br>
    김지남입니다.
  </p>
</body>
</html>
