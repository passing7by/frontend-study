<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    body *{
      /* border: 1px solid gray;
      min-height: 10px; */
    }

    /* 기본(공통) 스타일은 앞부분에 작성 */
    ul {
      list-style: none;
    }
    a {
      text-decoration: none;
      color: black;
    }

    .navbar {
      display: flex;
      column-gap: 10px;
    }
    .navbar li {
      width: 60px;
      background-color: #ddd;
      text-align: center;
      padding: 10px;
      border-radius: 5px;
    }
    .navbar li a {
      font-size: 20px;
    }

    .container {
      width: 800px;
      margin: 0 auto;
    }
    .blog-list-item {
      display: flex;
    }
    .blog-content {
      /* background-color: lightblue; */
      width: 80%;
      height: 200px;
    }
    .blog-img {
      /* background-color: lightcoral; */
      width: 20%;
      height: 200px;
    }

    .content-header {
      display: flex;
      align-items:  center;
    }
    .blog-profile {
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }
    .blog-name > h4,
    .blog-name > p {
      margin: 5px;
    }

    .blog-img > img {
      width: 100%;
      height: 100%;
    }

  </style>
</head>
<body>
  <!-- Tip! 레이아웃을 만드는 기본
    뭘 만들든 레이아웃은 항상 수평(행)으로 자른 후 박스부터 만들고 시작하면 됨
    그리고 이 박스들을 전부 <div>로 구현해 놓으면 됨(물론 시맨틱 태그도 최대한 활용)
    그리고 이 안에 글 넣고 그림 넣고 하면 끝!

    이 때 <div>는 블록 요소이기 때문에 위아래로 배치됨
    좌우로 나란히 배치하고 싶으면 float(🤬), inline-block(😐), Flexbox(😀)
  -->

  <!-- navbar -->
  <nav>
    <ul class="navbar">
      <li>
        <a href="#">영화</a>
      </li>
      <li>
        <a href="#">맛집</a>
      </li>
      <li>
        <a href="#">IT</a>
      </li>
      <li>
        <a href="#">컴퓨터</a>
      </li>
    </ul>
  </nav>

  <!-- blog list item -->
  <div class="container">
    <div class="blog-list-item">
      <div class="blog-content">
        <div class="content-header">
          <!-- 프로필 이미지 -->
          <img src="https://picsum.photos/300/300" alt="profile" class="blog-profile">
          <!-- 작성자, 시간 -->
          <div class="blog-name">
            <h4>김지남</h4>
            <p>1시간 전</p>
          </div>
        </div>
        <div class="content-body">
          <!-- 글 제목, 글 내용 -->
          <h4>정처기 실기 합격 꿀팁</h4>
          <p>
            화이팅하십쇼!!!!화이팅하십쇼!!!!화이팅하십쇼!!!!화이팅하십쇼!!!!화이팅하십쇼!!!!화이팅하십쇼!!!!화이팅하십쇼!!!!화이팅하십쇼!!!!
          </p>
        </div>
      </div>
      <div class="blog-img">
        <img src="https://picsum.photos/300/400" alt="샘플">
      </div>
    </div>
    </div>
  </div>
</body>
</html>
