<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    * {
      /* border: 1px solid gray;
      min-width: 20px;
      min-height: 20px; */
    }
    /* 공통 스타일 */
    * {
      box-sizing: border-box;
    }
    table {
      border-collapse: collapse;
    }
    
    img {
      width: 50px;
    }

    .cart-background {
      width: 100%;
      background-color: lightsteelblue;
      padding: 30px;
    }
    .inner {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .cart-list {
      width: 100%;
      background-color: #fff;
      border-radius: 10px;
    }
    .cart-list tr {
      border-bottom: 2px solid lightsteelblue;
    }
    .cart-list th, .cart-list td {
      padding: 15px;
      text-align: center;
      /* border-bottom: 2px solid lightsteelblue; */
    }
    .cart-list th:nth-child(2) {
      /* 의미: 다른 셀들은 최소폭을 가져가면서 해당 셀은 최대 400px까지 늘어남 */
      width: 400px;
    }
    .cart-list td:nth-child(2) {
      text-align: left;
    }
    /* 자식 선택자 사용 시 주의! */
    /* .cart-list > tbody > tr:last-child > td {} */
    .cart-list tr:last-child td {
      text-align: end;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      font-size: 20px;
    }
    .btn {
      padding: 14px 30px;
      font-size: 20px;
      /* font-size: inherit; */
      border: none;
      outline: none;
      border-radius: 10px;
      background-color: coral;
      color: #fff;
      cursor: pointer;
    }
    .btn:hover {
      background-color: chocolate;
    }
    .btn:active {
      background-color: brown;
    }
  </style>
</head>
<body>
  <div class="cart-background">
    <!-- 가운데 정렬을 위한 div -->
    <div class="inner">
      <h2>장바구니</h2>

      <!-- 4행 5열 만들기 -->
      <table class="cart-list">
        <tr>
          <th></th>
          <th>ITEM</th>
          <th>AMOUNT</th>
          <th>PRICE</th>
          <th>TOTAL</th>
        </tr>

        <tr>
          <td>
            <img src="./images1.jpg" alt="">
          </td>
          <td>농담곰 인형 - 우쭐왕</td>
          <td>1</td>
          <td>100,000</td>
          <td>100,000</td>
        </tr>
        <tr>
          <td>
            <img src="./images2.jpg" alt="">
          </td>
          <td>헬로키티 콜라보 농담곰 마스코트 인형</td>
          <td>2</td>
          <td>59,000</td>
          <td>118,000</td>
        </tr>
        
        <tr>
          <td colspan="5">주문금액 218,000원</td>
        </tr>
      </table>

      <div class="btn-group">
        <a href="#">계속 쇼핑하기</a>
        <button type="button" class="btn">구매하기</button>
      </div>
    </div>

  </div>
</body>
</html>
