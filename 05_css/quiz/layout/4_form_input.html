<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    .text-input {
      width: 120px;
      padding: 6px 10px;
      font-size: 20px;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;

      transition: 1s;
    }
    .text-input:hover {
      border-color: pink;
    }
    .text-input:focus {
      border-color: red;
    }

    /* 실전 */
    
    body * {
      /* border: 1px solid gray;
      min-height: 10px; */
    }

    [type=text], textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid lightgray;
      border-radius: 5px;
      box-sizing: border-box;
      outline: none;
      
      transition: 1s;
    }
    [type=text]:focus, textarea:focus {
      border: 2px solid rgb(247, 117, 42);
      /* outline: 2px solid red; */
    }
    

    .form-background {
      background-color: black;
      padding: 30px 0;
    }

    .form-container {
      background-color: #fff;
      width: 80%;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
    }

    .name {
      display: flex;
      justify-content: space-between;
      column-gap: 20px;
      margin-bottom: 50px;
    }
    .name div {
      flex-grow: 1;
    }
    
    .message {
      margin-bottom: 10px;
    }
    .message textarea {
      height: 100px;
      resize: none;
    }

    .send {
      display: flex;
      justify-content: space-between;
    }
    .send button {
      background-color: rgb(247, 117, 42);
      padding: 10px 35px;
      color: #fff;
      border: none;
      border-radius: 5px;
      transition: 0.5s;
    }
    .send button:hover {
      background-color: rgba(247, 117, 42, 0.6);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- <h2>연습</h2>
  <form> -->
    <!-- <input type="text">
    <input type="text" class="text-input">
    <button type="submit">전송</button> -->

    <!-- input 태그 쓸 대 label 태그도 같이 사용(권장) -->
    <!-- <label>너의 이름은
      <input type="text" class="text-input">
    </label>
    
    <p>
      <label for="name">너의 이름은</label>
    </p>
    <input type="text" id="name" class="text-input"> -->

    <h2>실전</h2>
    <div class="form-background">
      <div class="form-container">
        <form>
          <h3>Contact Us</h3>
          <div class="email">
            <label for="input-email">
              <p>Your Email</p>
            </label>
            <input type="text" placeholder="email@example.com" id="input-email">
          </div>
          <div class="name">
            <div class="name-first">
              <label for="input-name-first">
                <p>First Name</p>
              </label>
              <input type="text" id="input-name-first">
            </div>
            <div class="name-last">
              <label for="input-name-last">
                <p>Last Name</p>
              </label>
              <input type="text" id="input-name-last">
            </div>
          </div>
          <div class="message">
            <label for="message">
              <p>Message</p>
            </label>
            <textarea id="message"></textarea>
          </div>
          <div class="send">
            <label>
              <input type="checkbox" id="checkbox-agree">
              Agree
            </label>
            <button type="submit">SEND</button>
          </div>
        </form>
      </div>
    </div>
  </form>
</body>
</html>
