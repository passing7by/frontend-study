<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    * {
      /* border: 1px solid gray; */
      /* min-height: 20px; */
    }
    /* 공통 스타일 */
    * {
      box-sizing: border-box;
    }
    table {
      border-collapse: collapse;
    }

    /* 스타일 적용 시작 */
    .cart-background {
      background-color: lavender;
      padding: 40px 0;
    }
    .inner {
      width: 80%;
      margin: 0 auto;
    }

    .cart-list {
      background-color: #fff;
      width: 100%;
      border-radius: 15px;
      margin-bottom: 20px;
    }
    .cart-list td, th {
      padding: 15px;
    }
    .cart-list tr + tr, tfoot, tbody {
      border-top: 3px solid lavender;
    }
    .cart-list img {
      width: 100%;
    }
    .cart-list .th-img, .th-amount, .th-price, .th-total{
      width: 15%;
    }
    .cart-list tbody tr td:nth-child(n+3){
      text-align: center;
    }
    .cart-list .tr-sum td {
      text-align: end;
    }

    .inner div {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .inner div * {
      font-size: 20px;
    }
    .inner div button {
      background-color: rgba(216, 99, 138, 0.7);
      color: #fff;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      transition: 0.5s;
    }
    .inner div button:hover {
      background-color: rgba(216, 99, 138, 1);
      cursor: pointer;
    } 
  </style>
</head>
<body>
  <div class="cart-background">
    <!-- 가운데 정렬을 위한 div -->
    <div class="inner">
      <h2>장바구니</h2>

      <!-- 4행 5열 만들기 -->
      <table class="cart-list">
        <thead>
          <tr>
            <th class="th-img"></th>
            <th class="th-item">ITEM</th>
            <th class="th-amount">AMOUNT</th>
            <th class="th-price">PRICE</th>
            <th class="th-total">TOTAL</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>
              <img src="./images1.jpg" alt="">
            </td>
            <td>농담곰 인형 - 우쭐왕</td>
            <td>1</td>
            <td>100,000</td>
            <td>100,000</td>
          </tr>
          <tr>
            <td>
              <img src="./images2.jpg" alt="">
            </td>
            <td>헬로키티 콜라보 농담곰 마스코트 인형</td>
            <td>2</td>
            <td>59,000</td>
            <td>118,000</td>
          </tr>
        </tbody>

        <tfoot>
          <tr class="tr-sum">
            <td colspan="5">주문금액 218,000원</td>
          </tr>
        </tfoot>
      </table>

      <div>
        <a href="#">계속 쇼핑하기</a>
        <button>구매하기</button>
      </div>
    </div>

  </div>
</body>
</html>
