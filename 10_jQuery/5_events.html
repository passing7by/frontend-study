<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
  <button type="button" id="bind">Add Click</button>
  <button type="button" id="unbind">Remove Click</button>
  <button type="button" id="trigger">trigger</button>

  <script>
    // 제이쿼리 이벤트 참고: https://api.jquery.com/category/events/

    // on()으로 이벤트 핸들러를 연결하고, off()로 제거
    function clickHandler() {
      alert('thank you');
    }

    $('#bind').on('click', clickHandler); // 제거도 해야 하기 때문에 기명함수 전달(익명함수 사용 시 제거 못하기 때문)
    $('#unbind').on('click', function () {
      $('#bind').off('click', clickHandler); // 두 인자값을 전달해야 정확하게 제거 가능
      // $('#bind').off('click'); // click 시의 모든 함수가 제거됨
    });

    // trigger()로 이벤트를 강제로 발생
    $('#trigger').on('click', function () {
    // $('#trigger').on('click contextmenu', function () { // on 사용 시 이벤트를 여러개 추가 가능
    // $('#trigger').click(function () { // depredated
      $('#bind').trigger('click');
    });
  </script>
</body>
</html>
