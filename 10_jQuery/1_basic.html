<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <!-- jQuery 연결 -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <script>
    // 2. jQuery 위치에 따른 동작
    // 실행되지 않음
    // $('p').click(function () {
    //   alert('테스트');
    // });

    // $(document).ready(function () { // 웹문서가 완전히 로딩되면 실행할 함수를 ready() 안에 작성
    //   $('p').click(function () {
    //   alert('테스트');
    //   });
    // }); 
    // HTML 문서의 DOM이 완전히 로드된 후에 내부 코드를 실행하게 보장
    // 스크립트가 <body> 끝에 위치한 경우 생략 가능
    // 대부분의 경우 명시적으로 사용하는 것이 안전하고 권장됨

    // 축약형
    $(function () {
      $('p').click(function () {
      alert('테스트');
      });
    });
  </script>
</head>
<body>
  <div class="welcome"></div>
  <div class="welcome"></div>

  <p>클릭하십쇼</p>

  <script>
    // 1. jQuery 기본 문법
    // jQuery(제어대상).method1().method2();
    // 주로 별칭(alias) 사용
    // $(제어대상).method1().method2();

    // 제어대상에는 'CSS 선택자' 또는 DOM 객체 사용 가능
    $('.welcome').html('<b>안.세</b>').css('background-color', 'yellow');
    // (참고) 제이쿼리 메소드들은 제어했던 대상을 리턴해주기 때문에 메소드 체이닝이 가능
    // 위의 코드는 아래와 같음
    // $('.welcome').html('<b>안.세</b>')[메소드 실행 후 요소를 리턴해 줌!!].css('background-color', 'yellow');

    $(document.body).css('background-color', 'orange')
  </script>
</body>
</html>
